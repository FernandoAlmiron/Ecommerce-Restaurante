<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:hx-on="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Admin</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/errores.js}" defer></script>
</head>
<body>

<a th:href="@{/admin}">← Volver al panel</a>

<h1>Clientes</h1>
<div id="mensaje-error" hidden></div>

<div class="dos-paneles">

    <!-- ========== IZQUIERDA: buscador + lista ========== -->
    <div>
        <input type="search" name="q" placeholder="Buscar por nombre, apellido o DNI..."
               hx-get="/admin/clientes/buscar"
               hx-trigger="input changed delay:300ms, search"
               hx-target="#tabla-clientes">

        <details>
            <summary>+ Alta rápida de cliente</summary>
            <form hx-post="/admin/clientes"
                  hx-target="#tabla-clientes"
                  hx-swap="beforeend"
                  hx-on::after-request="if(event.detail.successful) this.reset()">
                <input type="text"   name="nombre"   placeholder="Nombre"   required>
                <input type="text"   name="apellido" placeholder="Apellido" required>
                <input type="number" name="dni"      placeholder="DNI"      required>
                <input type="text"   name="celular"  placeholder="Celular">
                <input type="email"  name="email"    placeholder="Email">
                <button type="submit">Guardar cliente</button>
            </form>
        </details>

        <table>
            <thead>
            <tr>
                <th>N°</th>
                <th>Nombre</th>
                <th>DNI</th>
                <th>Celular</th>
                <th>Email</th>
                <th>Cuenta</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tabla-clientes">
            <th:block th:replace="~{fragments/admin/cliente-fila :: filas}"></th:block>
            </tbody>
        </table>
    </div>

    <!-- ========== DERECHA: historial ========== -->
    <div id="detalle-cliente">
        <p>Elegí un cliente para ver su historial.</p>
    </div>

</div>

</body>
</html>
