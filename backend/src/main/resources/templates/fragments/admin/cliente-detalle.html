<!-- UNA fila: se usa al dar de alta un cliente -->
<tr th:fragment="fila">
    <td th:text="${c.idCliente}"></td>
    <td th:text="${c.nombre + ' ' + c.apellido}"></td>
    <td th:text="${c.dni}"></td>
    <td th:text="${c.celular}"></td>
    <td th:text="${c.email}"></td>
    <td th:text="${c.username != null ? 'Sí' : 'No'}"></td>
    <td>
        <button th:hx-get="@{/admin/clientes/{id}(id=${c.idCliente})}"
                hx-target="#detalle-cliente">
            Ver
        </button>
        <button th:hx-delete="@{/admin/clientes/{id}(id=${c.idCliente})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="¿Seguro que querés eliminar este cliente?">
            Eliminar
        </button>
    </td>
</tr>

<!-- TODAS las filas: se usa al cargar la página y en cada búsqueda -->
<th:block th:fragment="filas">
    <th:block th:each="c : ${clientes}">
        <tr th:replace="~{fragments/admin/cliente-fila :: fila}"></tr>
    </th:block>
    <tr th:if="${clientes.isEmpty()}">
        <td colspan="7">No se encontraron clientes</td>
    </tr>
</th:block>
