<tr th:fragment="fila" th:classappend="${s.alcanzoStockMinimo()} ? 'bajo-minimo'">
    <td th:text="${s.idStock}"></td>
    <td th:text="${s.nombre}"></td>
    <td th:text="${s.categoria != null ? s.categoria.nombre : '-'}"></td>
    <td th:text="${s.cantidadActual + ' ' + s.unidadMedida}"></td>
    <td th:text="${s.stockMinimoActivo ? s.stockMinimo : '-'}"></td>
    <td th:text="${s.alcanzoStockMinimo() ? '⚠ Reponer' : 'OK'}"></td>
    <td>
        <input type="number" name="cantidad" step="0.01" min="0.01" placeholder="Cant.">

        <button th:hx-put="@{/admin/insumos/{id}/reponer(id=${s.idStock})}"
                hx-include="closest td"
                hx-target="closest tr"
                hx-swap="outerHTML">
            + Reponer
        </button>

        <button th:hx-put="@{/admin/insumos/{id}/descontar(id=${s.idStock})}"
                hx-include="closest td"
                hx-target="closest tr"
                hx-swap="outerHTML">
            − Descontar
        </button>

        <button th:hx-delete="@{/admin/insumos/{id}(id=${s.idStock})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="¿Seguro que querés eliminar este insumo?">
            Eliminar
        </button>
    </td>
</tr>
