<tr th:fragment="fila">
    <td th:text="${prov.nroProveedor}"></td>
    <td th:text="${prov.razonSocial}"></td>
    <td th:text="${prov.cuit}"></td>
    <td th:text="${prov.telefono}"></td>
    <td th:text="${prov.email}"></td>
    <td th:text="${prov.categoria != null ? prov.categoria.nombre : '-'}"></td>
    <td>
        <button th:hx-delete="@{/admin/insumos/proveedores/{id}(id=${prov.nroProveedor})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="¿Seguro que querés eliminar este proveedor?">
            Eliminar
        </button>
    </td>
</tr>
