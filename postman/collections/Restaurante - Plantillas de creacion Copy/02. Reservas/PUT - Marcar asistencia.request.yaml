$kind: http-request
url: "{{baseUrl}}/api/reservas/{{nroReserva}}/asistencia?asistio=true"
method: PUT
queryParams:
  asistio: "true"
auth:
  type: basic
  credentials:
    username: recepcion
    password: "{{pass_recepcion}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
