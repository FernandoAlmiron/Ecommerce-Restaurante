$kind: http-request
url: "{{baseUrl}}/api/tarjetas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "titular": "TITULAR PRUEBA",
      "vencimiento": "2029-08"
    }
auth:
  type: basic
  credentials:
    username: caja
    password: "{{pass_caja}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
