$kind: http-request
url: "{{baseUrl}}/api/categorias/{{nroCategoriaNueva}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Bebidas {{sufijo}}",
      "descripcion": "Gaseosas y aguas",
      "activo": true
    }
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
