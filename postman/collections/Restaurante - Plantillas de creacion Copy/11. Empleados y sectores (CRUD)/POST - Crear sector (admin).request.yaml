$kind: http-request
description: Un sector con nombre nuevo no tiene permisos propios (rol EMPLEADO).
url: "{{baseUrl}}/api/sectores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "DEPOSITO {{sufijo}}",
      "activa": true,
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("idSectorNuevo", pm.response.json().idSector);
      }
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("sufijo", Date.now().toString().slice(-6));
    language: text/javascript
order: 2000
