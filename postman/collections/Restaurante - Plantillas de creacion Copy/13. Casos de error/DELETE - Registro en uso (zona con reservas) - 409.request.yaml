$kind: http-request
name: DELETE - Registro en uso (zona con reservas) -> 409
url: "{{baseUrl}}/api/zonas/1"
method: DELETE
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 4000
