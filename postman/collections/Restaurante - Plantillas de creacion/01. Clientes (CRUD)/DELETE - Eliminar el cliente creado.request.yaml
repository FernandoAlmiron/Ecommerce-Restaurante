$kind: http-request
description: Funciona porque el cliente no tiene reservas. Uno con reservas da 409.
url: "{{baseUrl}}/api/clientes/{{idClienteCrud}}"
method: DELETE
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
