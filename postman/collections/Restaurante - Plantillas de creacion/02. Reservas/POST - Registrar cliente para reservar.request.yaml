$kind: http-request
description: Publico. Guarda idCliente y dni para la reserva y el envio.
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{$randomFirstName}}",
      "apellido": "{{$randomLastName}}",
      "celular": "1155550009",
      "dni": {{dniNuevo}},
      "email": "{{$randomEmail}}",
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("idCliente", pm.response.json().idCliente);
        pm.collectionVariables.set("dniCliente", pm.response.json().dni);
      }
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("dniNuevo", Math.floor(20000000 + Math.random() * 30000000));
    language: text/javascript
order: 1000
