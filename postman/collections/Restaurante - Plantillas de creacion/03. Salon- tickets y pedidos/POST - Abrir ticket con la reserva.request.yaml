$kind: http-request
url: "{{baseUrl}}/api/tickets"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "restaurante": { "nroRestaurante": 1 },
      "reserva": { "nroReserva": {{nroReserva}} }
    }
auth:
  type: basic
  credentials:
    username: mozo
    password: "{{pass_mozo}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("nroTicketReserva", pm.response.json().nroTicket);
      }
    language: text/javascript
order: 2000
