$kind: http-request
description: Publico. Usa el cliente registrado en 02. Reservas.
url: "{{baseUrl}}/api/envios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idCliente": {{idCliente}},
      "dni": {{dniCliente}},
      "nroRestaurante": 1,
      "direccionEntrega": "Av. Rivadavia 5000, CABA",
      "nombreReceptor": "Receptor Prueba",
      "pedidos": [
        { "idMenu": 1, "cantidad": 2, "observaciones": "" },
        { "idMenu": 3, "cantidad": 1 }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("idEnvio", pm.response.json().idEnvio);
      }
    language: text/javascript
order: 1000
