$kind: http-request
url: "{{baseUrl}}/api/zonas/{{idZona}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Vereda {{sufijo}}",
      "capacidadMaxima": 14,
      "activa": true,
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
