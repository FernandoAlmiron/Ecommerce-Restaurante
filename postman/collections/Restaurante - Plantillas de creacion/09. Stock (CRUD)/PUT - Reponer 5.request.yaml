$kind: http-request
url: "{{baseUrl}}/api/stocks/{{idStockNuevo}}/reponer?cantidad=5"
method: PUT
queryParams:
  cantidad: "5"
auth:
  type: basic
  credentials:
    username: cocina
    password: "{{pass_cocina}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
