$kind: http-request
url: "{{baseUrl}}/api/categorias/{{nroCategoriaNueva}}"
method: DELETE
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000
