$kind: http-request
description: "Sectores: 1 ADMINISTRACION, 2 COCINA, 3 SALON, 4 BARRA, 5 CAJA, 6 REPARTIDOR, 7 RECEPCION, 8 RECURSOSHUMANOS. La clave del nuevo es empleado123."
url: "{{baseUrl}}/api/empleados"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{$randomFirstName}}",
      "apellido": "{{$randomLastName}}",
      "celular": "1155557777",
      "dni": {{dniNuevo}},
      "username": "empleado{{sufijo}}",
      "password": "empleado123",
      "sector": { "idSector": 2 }
    }
auth:
  type: basic
  credentials:
    username: rrhh
    password: "{{pass_rrhh}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("legajo", pm.response.json().legajo);
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("dniNuevo", Math.floor(20000000 + Math.random() * 30000000));
      pm.collectionVariables.set("sufijo", Date.now().toString().slice(-6));
    language: text/javascript
order: 7000
