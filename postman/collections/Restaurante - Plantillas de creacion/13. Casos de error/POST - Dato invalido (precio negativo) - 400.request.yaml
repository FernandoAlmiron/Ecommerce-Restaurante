$kind: http-request
name: POST - Dato invalido (precio negativo) -> 400
url: "{{baseUrl}}/api/menus"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Lasagna de verdura",
      "descripcion": "Capas de pasta con verduras y salsa blanca",
      "precio": -5,
      "disponible": true,
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: basic
  credentials:
    username: cocina
    password: "{{pass_cocina}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
