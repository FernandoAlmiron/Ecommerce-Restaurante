$kind: http-request
description: Crea la cuenta del cliente (clave cliente123). Desde aca, la carpeta Cliente usa este usuario. Si no se ejecuta, usa la cuenta de prueba cliente / cliente123.
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{$randomFirstName}}",
      "apellido": "{{$randomLastName}}",
      "celular": "1155550009",
      "dni": {{dniNuevo}},
      "email": "{{$randomEmail}}",
      "username": "cliente{{sufijo}}",
      "password": "cliente123",
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("usuarioCliente", pm.response.json().username);
        pm.collectionVariables.set("dniCliente", pm.response.json().dni);
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("dniNuevo", Math.floor(20000000 + Math.random() * 30000000));
      pm.collectionVariables.set("sufijo", Date.now().toString().slice(-6));
    language: text/javascript
order: 6000
