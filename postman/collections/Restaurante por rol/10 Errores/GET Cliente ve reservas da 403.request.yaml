$kind: http-request
url: "{{baseUrl}}/api/reservas"
method: GET
auth:
  type: basic
  credentials:
    username: "{{usuarioCliente}}"
    password: "{{passCliente}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000
