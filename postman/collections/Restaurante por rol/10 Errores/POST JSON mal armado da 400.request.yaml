$kind: http-request
url: "{{baseUrl}}/api/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "nombre": "Roto",'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
