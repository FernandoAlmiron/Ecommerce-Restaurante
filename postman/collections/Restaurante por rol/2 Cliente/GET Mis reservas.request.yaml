$kind: http-request
url: "{{baseUrl}}/api/mi-cuenta/reservas"
method: GET
auth:
  type: basic
  credentials:
    username: "{{usuarioCliente}}"
    password: "{{passCliente}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
