$kind: http-request
url: "{{baseUrl}}/api/reservas/walkin"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dni": {{dniCliente}},
      "nroRestaurante": 1,
      "idZona": 1,
      "cantComensales": 2
    }
auth:
  type: basic
  credentials:
    username: recepcion
    password: "{{pass_recepcion}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
