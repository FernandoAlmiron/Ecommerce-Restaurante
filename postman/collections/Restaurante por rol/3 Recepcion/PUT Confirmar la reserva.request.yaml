$kind: http-request
url: "{{baseUrl}}/api/reservas/{{nroReserva}}/confirmar"
method: PUT
auth:
  type: basic
  credentials:
    username: recepcion
    password: "{{pass_recepcion}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
