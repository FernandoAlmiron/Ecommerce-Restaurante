$kind: http-request
url: "{{baseUrl}}/api/pedidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menu": { "idMenu": 3 },
      "ticket": { "nroTicket": {{nroTicket}} },
      "cantidad": 1
    }
auth:
  type: basic
  credentials:
    username: mozo
    password: "{{pass_mozo}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
