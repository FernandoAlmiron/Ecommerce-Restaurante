$kind: http-request
description: Arma la receta del plato nuevo con el insumo nuevo.
url: "{{baseUrl}}/api/menu-ingredientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "menu": { "idMenu": {{idMenuNuevo}} },
      "stock": { "idStock": {{idStockNuevo}} },
      "cantidadNecesaria": 0.2
    }
auth:
  type: basic
  credentials:
    username: cocina
    password: "{{pass_cocina}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("idMenuIngrediente", pm.response.json().idMenuIngrediente);
      }
    language: text/javascript
order: 13000
