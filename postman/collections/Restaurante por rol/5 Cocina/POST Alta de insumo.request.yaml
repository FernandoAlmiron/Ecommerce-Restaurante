$kind: http-request
url: "{{baseUrl}}/api/stocks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Espinaca {{sufijo}}",
      "unidadMedida": "kg",
      "cantidadActual": 10,
      "stockMinimo": 2,
      "stockMinimoActivo": true,
      "restaurante": { "nroRestaurante": 1 },
      "categoria": { "nroCategoria": 1 }
    }
auth:
  type: basic
  credentials:
    username: cocina
    password: "{{pass_cocina}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("idStockNuevo", pm.response.json().idStock);
      }
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("sufijo", Date.now().toString().slice(-6));
    language: text/javascript
order: 6000
