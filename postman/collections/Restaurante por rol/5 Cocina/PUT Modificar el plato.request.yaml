$kind: http-request
url: "{{baseUrl}}/api/menus/{{idMenuNuevo}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Lasagna de verdura",
      "descripcion": "Capas de pasta con verduras y salsa blanca",
      "precio": 15200.00,
      "disponible": true,
      "restaurante": { "nroRestaurante": 1 }
    }
auth:
  type: basic
  credentials:
    username: cocina
    password: "{{pass_cocina}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
