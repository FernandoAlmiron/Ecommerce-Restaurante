$kind: http-request
url: "{{baseUrl}}/api/cierres-caja/{{idCierre}}"
method: GET
auth:
  type: basic
  credentials:
    username: caja
    password: "{{pass_caja}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
