$kind: http-request
description: "No hace falta el metodo de pago: se usa el que eligio el cliente al pedir."
url: "{{baseUrl}}/api/facturaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ticket": { "nroTicket": {{nroTicketEnvio}} }
    }
auth:
  type: basic
  credentials:
    username: caja
    password: "{{pass_caja}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
