$kind: http-request
description: "metodoPago: EFECTIVO, TARJETA o QR."
url: "{{baseUrl}}/api/facturaciones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ticket": { "nroTicket": {{nroTicket}} },
      "metodoPago": "EFECTIVO"
    }
auth:
  type: basic
  credentials:
    username: caja
    password: "{{pass_caja}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("nroFacturacion", pm.response.json().nroFacturacion);
      }
    language: text/javascript
order: 2000
