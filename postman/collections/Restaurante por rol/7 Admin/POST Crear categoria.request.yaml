$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Bebidas {{sufijo}}",
      "descripcion": "Gaseosas, aguas y vinos",
      "activo": true
    }
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.collectionVariables.set("nroCategoriaNueva", pm.response.json().nroCategoria);
      }
    language: text/javascript
  - type: beforeRequest
    code: pm.collectionVariables.set("sufijo", Date.now().toString().slice(-6));
    language: text/javascript
order: 9000
