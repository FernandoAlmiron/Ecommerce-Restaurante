$kind: http-request
url: "{{baseUrl}}/api/proveedores/{{nroProveedorNuevo}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "razonSocial": "Distribuidora Sur SRL",
      "cuit": "{{cuitNuevo}}",
      "telefono": "1145558888",
      "email": "ventas@distsur.example.com",
      "categoria": { "nroCategoria": 1 }
    }
auth:
  type: basic
  credentials:
    username: admin
    password: "{{pass_admin}}"
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 16000
