<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Plato fila</title>
</head>
<body>

<tr th:fragment="fila">
    <td th:text="${p.idMenu}"></td>
    <td th:text="${p.nombre}"></td>
    <td th:text="${p.descripcion}"></td>
    <td th:text="${'$' + p.precio}"></td>
    <td th:text="${p.disponible ? 'Sí' : 'No'}"></td>
    <td th:text="${p.restaurante.nombre}"></td>
    <td>
        <button th:hx-put="@{/admin/carta/{id}/disponibilidad(id=${p.idMenu})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                th:text="${p.disponible ? 'Marcar no disponible' : 'Marcar disponible'}">
        </button>

        <button th:hx-delete="@{/admin/carta/{id}(id=${p.idMenu})}"
                hx-target="closest tr"
                hx-swap="outerHTML"
                hx-confirm="¿Seguro que querés eliminar este plato?">
            Eliminar
        </button>
    </td>
</tr>

</body>
</html>
