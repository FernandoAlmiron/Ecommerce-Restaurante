<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta - La Nona</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- el celular: solo 10 números -->
    <script th:src="@{/js/campos.js}" defer></script>

</head>
<body class="cliente">

<!-- botón "Sobre nosotros" (arriba a la derecha, en todas las páginas) -->
<a th:replace="~{fragments/cliente/layout :: boton-nosotros}"></a>


<main class="auth">
    <img th:src="@{/img/logo.png}" alt="La Nona - pastas caseras" class="logo">
    <h1>Crear cuenta</h1>

    <p th:if="${error}" th:text="${error}" class="alerta error"></p>

    <form th:action="@{/registro}" method="post">
        <div class="fila">
            <input type="text" name="nombre"   placeholder="Nombre"   th:value="${param.nombre}"   required>
            <input type="text" name="apellido" placeholder="Apellido" th:value="${param.apellido}" required>
        </div>
        <input type="email"    name="email"     placeholder="Correo electrónico" th:value="${param.email}" required>
        <input type="password" name="password"  placeholder="Contraseña (mínimo 6)" required>
        <input type="password" name="password2" placeholder="Reingresar contraseña" required>
        <input type="tel"      name="celular"   placeholder="Celular (10 números, opcional)" th:value="${param.celular}"
               class="celular" inputmode="numeric" pattern="\d{10}" title="10 números, con el código de área (ej. 1155551234)">
        <input type="text"     name="dni"       placeholder="DNI (sin puntos)" th:value="${param.dni}" required
               class="dni" inputmode="numeric" pattern="\d{7,8}" title="7 u 8 números, sin puntos">

        <!-- obligatoria: sin tildarla no se crea la cuenta (el controlador también lo revisa) -->
        <label class="acepto">
            <input type="checkbox" name="acepto" value="true" required th:checked="${param.acepto != null}">
            <span>Leí y acepto los <a th:href="@{/terminos}" target="_blank">Términos y condiciones</a>
                y la <a th:href="@{/privacidad}" target="_blank">Política de privacidad</a></span>
        </label>
        <button type="submit">Registrarme</button>
    </form>

    <a th:href="@{/login}">Ya tengo cuenta</a>
</main>

<footer th:replace="~{fragments/cliente/layout :: footer(false)}"></footer>

</body>
</html>
