<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¿Cómo querés disfrutar? - La Nona</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="cliente">

<!-- botón "Sobre nosotros" (arriba a la derecha, en todas las páginas) -->
<a th:replace="~{fragments/cliente/layout :: boton-nosotros}"></a>

<header><img th:src="@{/img/logo.png}" alt="La Nona - pastas caseras" class="logo"></header>

<main class="elegir">
    <a th:href="@{/reservas/nueva}" class="opcion">
        <img th:src="@{/img/presencial.png}" alt="">
        <span>PRESENCIAL</span>
    </a>
    <a th:href="@{/delivery}" class="opcion">
        <img th:src="@{/img/delivery.png}" alt="">
        <span>DELIVERY</span>
    </a>
</main>

<form th:action="@{/logout}" method="post" class="cerrar-sesion"><button type="submit">Cerrar sesión</button></form>

</body>
</html>
