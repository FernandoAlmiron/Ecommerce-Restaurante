<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Nona - Pastas caseras</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body class="cliente">

<!-- botón "Sobre nosotros" (arriba a la derecha, en todas las páginas) -->
<a th:replace="~{fragments/cliente/layout :: boton-nosotros}"></a>


<header><img th:src="@{/img/logo.png}" alt="La Nona - pastas caseras" class="logo"></header>

<main class="carta">
    <article class="plato" th:each="p : ${platos}">
        <img th:src="@{/img/platos/{id}.jpg(id=${p.idMenu})}" th:alt="${p.nombre}">
        <div>
            <h3 th:text="${p.nombre}"></h3>
            <p th:text="${p.descripcion}"></p>
            <strong th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}"></strong>
        </div>
    </article>
</main>

<footer th:replace="~{fragments/cliente/layout :: footer(false)}"></footer>

<footer class="acciones">
    <a th:href="@{/login}" class="boton">Iniciar / Registrarme</a>
    <small>Registrese para reservar y/o delivery</small>
</footer>

</body>
</html>
