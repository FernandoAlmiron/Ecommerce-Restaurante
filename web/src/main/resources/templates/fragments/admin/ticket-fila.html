<tr th:fragment="fila"
    th:id="'ticket-' + ${t.nroTicket}"
    th:hx-swap-oob="${oob} ? 'true'">
    <td th:text="${t.nroTicket}"></td>
    <td th:text="${t.reserva != null ? 'Reserva #' + t.reserva.nroReserva : 'Sin reserva'}"></td>
    <td th:text="${t.facturacion == null ? 'Abierto'
                 : (t.facturacion.estadoPago.name() == 'PAGADO' ? 'Pagado' : 'Por cobrar')}"></td>
    <td>
        <button th:hx-get="@{/admin/salon/{id}(id=${t.nroTicket})}"
                hx-target="#detalle-ticket">
            Ver
        </button>
    </td>
</tr>
