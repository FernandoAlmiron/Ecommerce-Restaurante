# Configuracion propia del front web.
# La conexion a MySQL NO va aca: se usa la del application.properties del backend
# (variables DB_URL, DB_USER y DB_PASSWORD), asi esta escrita una sola vez.

# 8081 para no chocar con el backend (8080): se pueden tener los dos prendidos a la vez
server.port=8081
spring.jpa.show-sql=false
